services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: touchctf
      POSTGRES_USER: touchctf
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U touchctf -d touchctf"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_BACKEND: postgresql
      DATABASE_URL: postgresql://touchctf:${DB_PASSWORD}@db:5432/touchctf
      APP_SECRET_FILE: /run/secrets/app_secret
    secrets:
      - app_secret
      - db_password
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_BACKEND: postgresql
      DATABASE_URL: postgresql://touchctf:${DB_PASSWORD}@db:5432/touchctf
      APP_SECRET_FILE: /run/secrets/app_secret
      APP_ENV: production
      MEDIA_DIR: /app/media
      API_WORKERS: ${API_WORKERS:-2}
    secrets:
      - app_secret
      - db_password
    volumes:
      - media_data:/app/media
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  edge:
    build:
      context: .
      dockerfile: edge/Dockerfile
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./edge/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  media_data:

networks:
  backend:

secrets:
  app_secret:
    file: ./secrets/app_secret.txt
  db_password:
    file: ./secrets/db_password.txt
