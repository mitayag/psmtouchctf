services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: touchctf
      POSTGRES_USER: touchctf
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U touchctf -d touchctf"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_BACKEND: postgresql
      DATABASE_URL: postgresql://touchctf:${DB_PASSWORD}@db:5432/touchctf
      APP_SECRET_FILE: /run/secrets/app_secret
    secrets:
      - app_secret
      - db_password
    volumes:
      - ./api/alembic:/app/alembic:ro
      - ./api/alembic.ini:/app/alembic.ini:ro
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_BACKEND: postgresql
      DATABASE_URL: postgresql://touchctf:${DB_PASSWORD}@db:5432/touchctf
      APP_SECRET_FILE: /run/secrets/app_secret
      MEDIA_DIR: /app/media
      API_WORKERS: 2
    secrets:
      - app_secret
      - db_password
    volumes:
      - media_data:/app/media
      - ./api/data:/app/data:ro
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  edge:
    image: nginx:alpine
    ports:
      - "5173:80"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ui/dist:/usr/share/nginx/html:ro
    networks:
      - backend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:

networks:
  backend:

secrets:
  app_secret:
    file: ./secrets/app_secret.txt
  db_password:
    file: ./secrets/db_password.txt
